# The workbench-app window (Tauri): build on an app-v* tag and attach the binaries
# that `jura setup` downloads. Each tar.xz holds the bare `workbench-app` binary —
# setup's fetch() unpacks the member named after the tool into ~/.local/bin.
name: app
on:
  push:
    tags:
      - "app-v*"
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { runs-on: ubuntu-24.04, arch: x86_64 }
          - { runs-on: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install the libraries Tauri links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libssl-dev
      - name: Build (release)
        run: cargo build --release --manifest-path app/Cargo.toml
      - name: Archive the binary
        run: |
          cd app/target/release
          tar -cJf "workbench-app-${{ matrix.arch }}.tar.xz" workbench-app
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "workbench-app $GITHUB_REF_NAME" --notes "The native window. \`jura setup\` downloads the binary for your architecture; the webkit2gtk-4.1 runtime libraries are asked for separately (sudo)." --verify-tag 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "app/target/release/workbench-app-${{ matrix.arch }}.tar.xz" --clobber
