[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jura-workbench"
version = "0.1.0a1"
description = "jura workbench: write a case with agents next to evid and did, in one window."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "src/workbench/write/LICENSE-treedit.txt", "src/workbench/write/vendor/LICENSE-xterm.txt"]
dependencies = [
    "treeparse>=0.4.0",
]

[project.scripts]
jura = "workbench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/write"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]  # pinned, as in treedit: ruff 0.16 widened the default set

[tool.ruff.lint.per-file-ignores]
# Forked from treedit: keep its import order so diffs against upstream stay small.
"src/workbench/write/*" = ["I"]
"tests/write/*" = ["I"]
